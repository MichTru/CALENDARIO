<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Tana del Diavolo · Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e3001b;--red-dark:#9e0013;--black:#0a0a0a;--card:#141414;--card2:#1c1c1c;
  --line:#262626;--text:#f5f5f5;--muted:#8a8a8a;--gold:#f2c94c;--green:#3ddc84;--orange:#ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* header */
.hero{position:relative;overflow:hidden;padding:18px 16px 26px;
  background:repeating-linear-gradient(90deg,var(--red) 0 38px,#111 38px 76px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.85) 60%,var(--black) 100%)}
.hero>*{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:Anton,sans-serif;font-size:22px;letter-spacing:1px;text-transform:uppercase}
.brand span{color:var(--red)}
.menu-btn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.menu-btn i{display:block;width:18px;height:2px;background:#fff;box-shadow:0 6px #fff,0 -6px #fff}

/* next match */
.next{margin-top:22px}
.label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
.next-teams{font-family:Anton,sans-serif;font-size:40px;line-height:1;margin-top:8px;text-transform:uppercase}
.next-teams .vs{display:block;font-family:Inter;font-size:13px;font-weight:600;color:var(--muted);margin:6px 0;letter-spacing:2px}
.next-teams .me{color:var(--red)}
.next-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}
.chip.gold{color:var(--gold)}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.5px;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}

main{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.month-title{font-family:Anton,sans-serif;font-size:28px;text-transform:uppercase;margin:18px 0 10px}

/* card */
.match{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.match.open{border-color:var(--red)}
.match.past{opacity:.45}
.match.is-next{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.m-head{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:14px;text-align:left}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date b{display:block;font-family:Anton,sans-serif;font-size:26px;line-height:1}
.date small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.teams{font-weight:800;font-size:16px;line-height:1.25;text-transform:uppercase}
.teams .me{color:var(--red)}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.tag{font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.tag.home{background:rgba(61,220,132,.12);color:var(--green)}
.tag.away{background:rgba(255,159,67,.12);color:var(--orange)}
.tag.derby{background:var(--red);color:#fff}
.time{font-family:Anton,sans-serif;font-size:20px;color:var(--gold)}
.arrow{display:block;margin:4px auto 0;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.match.open .arrow{transform:rotate(-135deg)}

/* timeline */
.panel{display:none;padding:4px 14px 14px}
.match.open .panel{display:block}
.step{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.step::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.step:first-child::before{top:50%}.step:last-child::before{bottom:50%}
.dot{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--muted);position:relative;z-index:1}
.step.done .dot{background:var(--red);border-color:var(--red)}
.step b{display:block;font-size:14px}
.step span{font-size:12px;color:var(--gold);font-weight:600}
.go{font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);text-decoration:none;white-space:nowrap}
.step.done .go{background:var(--red);border-color:var(--red)}

footer{text-align:center;padding:30px 16px 40px;font-family:Anton,sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase;color:var(--red)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(300px,85vw);background:#111;z-index:100;transform:translateX(100%);transition:transform .25s;padding:20px 16px;border-left:3px solid var(--red);display:flex;flex-direction:column;gap:8px}
body.menu .overlay{opacity:1;pointer-events:auto}
body.menu .drawer{transform:none}
.drawer h3{font-family:Anton,sans-serif;font-size:22px;text-transform:uppercase;margin-bottom:8px}
.drawer h3 span{color:var(--red)}
.drawer a{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700}
.close{margin-top:auto;padding:14px;border-radius:12px;background:var(--red);font-weight:800}
</style>
</head>
<body>

<header class="hero">
  <div class="top">
    <div class="brand">Tana del <span>Diavolo</span></div>
    <button class="menu-btn" onclick="menu(true)" aria-label="Menu"><i></i></button>
  </div>
  <div class="next" id="next"></div>
</header>

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<main id="list"></main>
<footer>Forza Milan 🔴⚫</footer>

<div class="overlay" onclick="menu(false)"></div>
<aside class="drawer">
  <h3>Menu <span>Milan</span></h3>
  <a href="https://www.google.com/search?q=terna+arbitrale+Milan" target="_blank" rel="noopener">🧑‍⚖️ Terna arbitrale</a>
  <a href="https://www.google.com/search?q=formazioni+probabili+Milan" target="_blank" rel="noopener">📋 Formazioni probabili</a>
  <a href="https://www.google.com/search?q=formazioni+ufficiali+Milan" target="_blank" rel="noopener">✅ Formazioni ufficiali</a>
  <a href="https://www.google.com/search?q=classifica+serie+a" target="_blank" rel="noopener">🏆 Classifica Serie A</a>
  <a href="https://www.google.com/search?q=calciomercato+Milan" target="_blank" rel="noopener">💰 Calciomercato</a>
  <button class="close" onclick="menu(false)">Chiudi</button>
</aside>

<script>
const M=[
 ["2026-11-05T18:45","FERENCVAROS",1,"San Siro","Europa League"],
 ["2026-11-08T15:00","GENOA",0,"Ferraris","Serie A"],
 ["2026-11-22T18:00","FROSINONE",1,"San Siro","Serie A"],
 ["2026-11-30T20:45","CAGLIARI",0,"Unipol Domus","Serie A"],
 ["2026-12-06T20:45","PARMA",1,"San Siro","Serie A"],
 ["2026-12-13T20:45","NAPOLI",0,"Maradona","Serie A"],
 ["2026-12-19T18:00","COMO",1,"San Siro","Serie A"],
 ["2027-01-02T20:45","MONZA",0,"","Serie A"],
 ["2027-01-05T20:45","FIORENTINA",1,"San Siro","Serie A"],
 ["2027-01-09T18:00","ROMA",0,"Olimpico","Serie A"],
 ["2027-01-13T21:00","MONZA",1,"San Siro","Coppa Italia"],
 ["2027-01-17T15:00","TORINO",1,"San Siro","Serie A"],
 ["2027-01-24T15:00","FROSINONE",0,"","Serie A"],
 ["2027-01-31T15:00","JUVENTUS",1,"San Siro","Serie A"],
 ["2027-02-07T15:00","BOLOGNA",0,"Dall'Ara","Serie A"],
 ["2027-02-14T15:00","INTER",2,"San Siro","Serie A"],
 ["2027-02-21T15:00","GENOA",1,"San Siro","Serie A"],
 ["2027-02-28T15:00","COMO",0,"Sinigaglia","Serie A"],
 ["2027-03-07T15:00","CAGLIARI",1,"San Siro","Serie A"],
 ["2027-03-14T15:00","SASSUOLO",1,"San Siro","Serie A"],
 ["2027-03-21T15:00","ATALANTA",0,"Bergamo","Serie A"],
 ["2027-04-04T15:00","MONZA",1,"San Siro","Serie A"],
 ["2027-04-11T15:00","FIORENTINA",0,"Franchi","Serie A"],
 ["2027-04-18T15:00","NAPOLI",1,"San Siro","Serie A"],
 ["2027-04-25T15:00","LECCE",0,"Via del Mare","Serie A"],
 ["2027-05-02T15:00","LAZIO",1,"San Siro","Serie A"],
 ["2027-05-09T15:00","PARMA",0,"Tardini","Serie A"],
 ["2027-05-16T15:00","ROMA",1,"San Siro","Serie A"],
 ["2027-05-23T15:00","VENEZIA",0,"Penzo","Serie A"],
 ["2027-05-30T15:00","UDINESE",1,"San Siro","Serie A"]
].map(([k,avv,home,stadio,comp])=>({k:new Date(k),avv,home,stadio,comp}));

const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GG=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const now=new Date();
const pad=n=>String(n).padStart(2,"0");
const ora=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const quando=d=>GG[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()].slice(0,3).toLowerCase()+" · "+ora(d);
const add=(d,min)=>new Date(d.getTime()+min*60000);
const teams=m=>m.home===1?`<span class="me">Milan</span> vs ${m.avv}`:`${m.avv} vs <span class="me">Milan</span>`;
const tag=m=>m.home===2?'<span class="tag derby">Derby</span>':m.home?'<span class="tag home">Casa</span>':'<span class="tag away">Trasferta</span>';
const q=s=>"https://www.google.com/search?q="+encodeURIComponent(s);

const next=M.find(m=>add(m.k,110)>now)||M[M.length-1];
const nextIdx=M.indexOf(next);

document.getElementById("next").innerHTML=`
 <div class="label">${add(next.k,0)<=now?"In corso":"Prossima partita"}</div>
 <div class="next-teams">${next.home===1?'<span class="me">Milan</span>':next.avv}<span class="vs">VS</span>${next.home===1?next.avv:'<span class="me">Milan</span>'}</div>
 <div class="next-meta">
  <span class="chip gold">${quando(next.k)}</span>
  <span class="chip">${next.comp}</span>
  ${next.stadio?`<span class="chip">${next.stadio}</span>`:""}
 </div>`;

function steps(m){
 let prob=add(m.k,-21*60); if(prob.getHours()>=22) prob.setHours(21,0,0,0);
 const s=[
  ["🎙️ Pre-partita",add(m.k,-24*60),"pre partita"],
  ["📋 Formazioni probabili",prob,"formazioni probabili"],
  ["✅ Formazioni ufficiali",add(m.k,-60),"formazioni ufficiali"],
  ["⏱️ Fine primo tempo",add(m.k,47),"risultato primo tempo"],
  ["🏁 Risultato finale",add(m.k,110),"risultato"],
  ["⭐ Pagelle",add(m.k,155),"pagelle"],
  ["🔥 Top e flop",add(m.k,200),"top e flop"]
 ];
 return s.map(([t,d,k])=>`<div class="step${d<=now?" done":""}"><i class="dot"></i><div><b>${t}</b><span>${quando(d)}</span></div><a class="go" href="${q(k+" Milan "+m.avv)}" target="_blank" rel="noopener">Vedi</a></div>`).join("");
}

const months=[...new Set(M.map(m=>m.k.getFullYear()*12+m.k.getMonth()))];
const list=document.getElementById("list"), tabs=document.getElementById("tabs");

function render(mk){
 tabs.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",+b.dataset.m===mk));
 const ms=M.filter(m=>m.k.getFullYear()*12+m.k.getMonth()===mk);
 list.innerHTML=`<h2 class="month-title">${MESI[mk%12]}</h2>`+ms.map(m=>{
  const i=M.indexOf(m), past=add(m.k,110)<=now;
  return `<article class="match${past?" past":""}${i===nextIdx?" is-next":""}">
   <button class="m-head" onclick="this.parentNode.classList.toggle('open')">
    <div class="date"><b>${m.k.getDate()}</b><small>${GG[m.k.getDay()]}</small></div>
    <div><div class="teams">${teams(m)}</div><div class="sub">${tag(m)}<span>${m.comp}${m.stadio?" · "+m.stadio:""}</span></div></div>
    <div><div class="time">${ora(m.k)}</div><i class="arrow"></i></div>
   </button>
   <div class="panel">${steps(m)}</div>
  </article>`}).join("");
}

tabs.innerHTML=months.map(mk=>`<button class="tab" data-m="${mk}">${MESI[mk%12].slice(0,3)}</button>`).join("");
tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{render(+b.dataset.m);b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})});

const startM=next.k.getFullYear()*12+next.k.getMonth();
render(startM);
tabs.querySelector(`[data-m="${startM}"]`).scrollIntoView({inline:"center",block:"nearest"});

function menu(o){document.body.classList.toggle("menu",o)}
</script>
</body>
</html>
